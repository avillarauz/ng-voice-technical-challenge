apiVersion: v1
kind: Namespace
metadata:
  name: lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-web
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-web
  template:
    metadata:
      labels:
        app: lab-web
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-worker-01
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lab-web
  namespace: lab
spec:
  type: NodePort
  selector:
    app: lab-web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
